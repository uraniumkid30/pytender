name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.event.release.tag_name }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.14"}
      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import re, pathlib, os
          text=pathlib.Path('src/pytender/_version.py').read_text()
          version=re.search(r"__version__ = ['\"]([^'\"]+)", text).group(1)
          tag=os.environ['TAG']
          assert tag == f'v{version}', f'{tag=} does not match v{version}'
          PY
        env:
          TAG: "${{ github.event.release.tag_name }}"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with: {name: release-dists, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: pypi}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: {name: release-dists, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
